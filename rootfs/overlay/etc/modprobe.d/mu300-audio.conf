# The call-audio loader and its private DSP memory reservation are no longer shipped.
# Keep legacy SoC/DSP modules from autoloading out of old module sets without the
# required board setup. Generic ALSA, USB audio and Bluetooth modules are unaffected.
install agdsp_access /bin/false
install audio_dsp_dump /bin/false
install audio_pipe /bin/false
install audio_mem /bin/false
install audio_sipc /bin/false
install mcdt_hw_r2p0 /bin/false
install saudio /bin/false
install snd_soc_sprd_card /bin/false
install snd_soc_sprd_codec_ump9620_power_dev /bin/false
install snd_soc_sprd_codec_ump9620_power /bin/false
install snd_soc_sprd_codec_ump9620 /bin/false
install snd_soc_sprd_dai /bin/false
install snd_soc_sprd_dummy_codec /bin/false
install snd_soc_sprd_pa_ucp1301 /bin/false
install snd_soc_sprd_vaudio /bin/false
install snd_soc_sprd_vbc_fe /bin/false
install snd_soc_sprd_vbc_v4 /bin/false
install sprd_compr_2stage_dma /bin/false
install sprd_dmaengine_pcm /bin/false
install sprd_platform_pcm_routing /bin/false
install sprd_apipe /bin/false
install sprd_audcp_boot /bin/false
install sprd_audcp_dvfs /bin/false
